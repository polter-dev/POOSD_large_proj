<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menu Macro Fitter prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!--
  Prototype for #18: every screen for web (1280 x 832) and mobile (Android, 412 x 917), built from
  docs/design-spec.md. Open it in a browser:
    prototype.html                     all frames on one canvas (import this into Figma, see README.md)
    prototype.html?frame=web-login     one frame at its exact size; buttons click through to the next frame
  Data is real: menu items from backend/db/menu-data/chains.js, calories for seed user janedoe
  (docs/api-contract.md: maintenance 2058, target 1558, perMeal 519).
  Frames 09-20 (#114) are the M6 screens: tracker, add to tracker, plan, photo log, the community forms,
  My submissions and the admin review queue (web only). They use the M6 navigation (seven sections on web,
  six tabs on mobile); frames 01-08 keep the navigation they were exported with.
-->
<style>
/* docs/design-spec.md section 6 (same as web/src/styles/tokens.css) */
:root {
  --bg: #FFFFFF; --surface: #F5F6F8; --border: #E3E6EA; --border-input: #858E99;
  --text: #1A1D21; --text-muted: #5B6470;
  --primary: #15803D; --primary-hover: #166534; --on-primary: #FFFFFF;
  --fit-great-bg: #DCFCE7; --fit-great-text: #166534;
  --fit-ok-bg: #FEF3C7; --fit-ok-text: #92400E;
  --fit-over-bg: #FEE2E2; --fit-over-text: #B91C1C;
  --error: #B91C1C; --error-bg: #FEE2E2;
  --macro-protein: #2563EB; --macro-carbs: #EA580C; --macro-fat: #A16207; --macro-unknown: #808994;
  --radius-input: 8px; --radius-card: 12px;
  --font: "Manrope", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); color: var(--text); background: #E9EBEF; -webkit-font-smoothing: antialiased; }
body.single { background: var(--bg); }
button, input, select { font: inherit; color: inherit; }

/* Canvas: every frame with its label, grouped by platform */
.canvas { padding: 48px; display: flex; flex-direction: column; gap: 64px; }
.canvas h2.group { font-size: 32px; font-weight: 700; color: #3B4048; }
.row { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; }
.slot { display: flex; flex-direction: column; gap: 12px; }
.slot > .label { font-size: 15px; font-weight: 600; color: #5B6470; }

.frame { background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.frame.web { width: 1280px; height: 832px; }
.frame.mobile { width: 412px; height: 917px; }
.canvas .frame { box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.06); }

/* Type (spec section 2) */
.display { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.h1 { font-size: 28px; font-weight: 700; line-height: 1.2; }
.h2 { font-size: 20px; font-weight: 600; line-height: 1.3; }
.body { font-size: 16px; line-height: 1.5; }
.small { font-size: 14px; line-height: 1.4; }
.caption { font-size: 12px; font-weight: 500; line-height: 1.3; }
.muted { color: var(--text-muted); }
.num { font-variant-numeric: tabular-nums; }

/* Components (spec section 4) */
.btn { height: 48px; border-radius: var(--radius-input); font-size: 16px; font-weight: 600; display: flex;
  align-items: center; justify-content: center; width: 100%; border: 0; cursor: pointer; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border-input); }
.link { color: var(--primary); font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 14px; font-weight: 600; }
.input { height: 48px; border: 1px solid var(--border-input); border-radius: var(--radius-input); padding: 0 12px;
  display: flex; align-items: center; justify-content: space-between; font-size: 16px; background: var(--bg); }
.input.focus { border-color: var(--primary); outline: 1px solid var(--primary); }
.input.error { border-color: var(--error); }
.input .ph { color: var(--text-muted); }
.input .toggle { color: var(--primary); font-size: 14px; font-weight: 600; }
.field .err { color: var(--error); font-size: 14px; }
.banner { display: flex; gap: 12px; padding: 12px; border-radius: var(--radius-input); font-size: 14px; }
.banner.error { background: var(--error-bg); color: var(--error); }
.banner.info { background: var(--fit-great-bg); color: var(--fit-great-text); }
.banner b { font-weight: 600; text-decoration: underline; }
.seg { display: flex; border: 1px solid var(--border-input); border-radius: var(--radius-input); overflow: hidden; height: 48px; }
.seg span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
  border-left: 1px solid var(--border-input); }
.seg span:first-child { border-left: 0; }
.seg span.on { background: var(--primary); color: var(--on-primary); }
.chips { display: flex; gap: 8px; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-input); display: flex;
  align-items: center; font-size: 14px; font-weight: 600; }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-card);
  box-shadow: 0 1px 2px rgba(0,0,0,.06); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.tap { cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.great { background: var(--fit-great-bg); color: var(--fit-great-text); }
.pill.ok { background: var(--fit-ok-bg); color: var(--fit-ok-text); }
.pill.none { background: var(--surface); color: var(--text-muted); }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.bar i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; font-size: 14px; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
.between { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.stack { display: flex; flex-direction: column; }

/* App chrome */
.topbar { height: 64px; border-bottom: 1px solid var(--border); display: flex; align-items: center; flex-shrink: 0; }
.topbar .inner { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 32px; }
.brand { font-size: 18px; font-weight: 700; }
.brand.green { color: var(--primary); font-size: 16px; }
.nav { display: flex; gap: 24px; flex: 1; }
.nav a { font-size: 15px; font-weight: 600; color: var(--text-muted); text-decoration: none; padding: 21px 0;
  border-bottom: 2px solid transparent; cursor: pointer; }
.nav a.on { color: var(--text); border-color: var(--primary); }
.avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.page { flex: 1; overflow: hidden; }
.page .inner { max-width: 1040px; margin: 0 auto; padding: 32px 24px; }
.mtop { height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.mpage { flex: 1; overflow: hidden; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
.tabs { height: 72px; border-top: 1px solid var(--border); display: flex; flex-shrink: 0; background: var(--bg); }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 12px; font-weight: 600; color: var(--text-muted); text-decoration: none; cursor: pointer; }
.tabs a.on { color: var(--primary); }
.tabs svg { width: 24px; height: 24px; }

/* Auth layout: 400 wide on web, 16 side padding on mobile */
.auth { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 448px; margin: 0 auto; padding: 0 24px; gap: 16px; }
.frame.mobile .auth { width: 100%; padding: 0 16px; justify-content: flex-start; padding-top: 96px; }
.auth .brand { margin-bottom: 16px; }
.auth .h1 { margin-bottom: 8px; }
.center { text-align: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* M6 screens (#114) */
.nav.m6 { gap: 20px; }
.nav.m6 a { font-size: 15px; white-space: nowrap; }
.tabs.m6 a { font-size: 11px; }
.mpage > * { flex-shrink: 0; }
.pill.over { background: var(--fit-over-bg); color: var(--fit-over-text); }
.btn.sm { height: 40px; width: auto; padding: 0 16px; font-size: 14px; white-space: nowrap; }
.btn.auto { width: auto; padding: 0 20px; white-space: nowrap; gap: 8px; }
.btn.text { background: none; color: var(--primary); width: auto; padding: 0 8px; height: 40px; font-size: 14px; gap: 6px; }
.btn svg { flex-shrink: 0; }
.iconbtn { width: 48px; height: 48px; border: 1px solid var(--border-input); border-radius: var(--radius-input); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg); }
.iconbtn.round { width: 40px; height: 40px; border-radius: 999px; }
.iconbtn.bare { border: 0; width: 40px; height: 40px; color: var(--text-muted); }
.chip.track { color: var(--text-muted); gap: 6px; }
.chip.track.on { background: var(--fit-great-bg); border-color: var(--primary); color: var(--fit-great-text); }
.progress { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface); }
.progress i { display: block; height: 100%; }
.progress .eaten { background: var(--primary); }
.progress .overgoal { background: var(--fit-ok-text); }
.progress .planned { background: repeating-linear-gradient(135deg, var(--primary) 0 1.5px, var(--surface) 1.5px 5px); }
.lrow { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.lrow:last-child { border-bottom: 0; }
.lrow.sel { background: var(--fit-great-bg); border-radius: var(--radius-input); padding: 12px; border-bottom-color: transparent; }
.switch { width: 48px; height: 28px; border-radius: 999px; background: var(--primary); position: relative; flex-shrink: 0; }
.switch::after { content: ''; position: absolute; top: 4px; left: 24px; width: 20px; height: 20px; border-radius: 999px; background: var(--bg); }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 5; }
.dialog { width: 560px; max-height: 784px; flex-shrink: 0; overflow: hidden; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-card);
  padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.sheet { width: 100%; align-self: flex-end; background: var(--bg); border-radius: 16px 16px 0 0; padding: 12px 16px 24px;
  display: flex; flex-direction: column; gap: 12px; }
.sheet .grab { width: 32px; height: 4px; border-radius: 2px; background: var(--border-input); margin: 0 auto 4px; }
.fab { position: absolute; right: 16px; bottom: 88px; height: 56px; padding: 0 20px; border-radius: 16px; z-index: 2;
  background: var(--fit-great-bg); color: var(--fit-great-text); display: flex; align-items: center; gap: 8px; font-size: 15px;
  font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.18); cursor: pointer; }
table.change { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
table.change th, table.change td { padding: 5px 12px 5px 0; vertical-align: top; }
table.change thead th { color: var(--text-muted); font-weight: 500; }
table.change tbody tr { border-top: 1px solid var(--border); }
table.change tbody th { color: var(--text-muted); font-weight: 500; width: 130px; }
table.change td.before { text-decoration: line-through; text-decoration-color: rgba(91,100,112,.6); }
table.change td.prop { font-weight: 600; word-break: break-all; }
.note { background: var(--surface); border-radius: var(--radius-input); padding: 12px; font-size: 14px; }
.subcard { background: var(--surface); border-radius: var(--radius-input); padding: 12px; }
.empty-icon { width: 64px; height: 64px; border-radius: 999px; background: var(--fit-great-bg); color: var(--fit-great-text);
  display: flex; align-items: center; justify-content: center; margin: 0 auto; }
</style>
</head>

<div id="root"></div>
<script>
// ---------- data ----------

// Set while a frame renders: true for the M6 frames, which use the M6 navigation.
let M6 = false;

// ---------- building blocks ----------
const go = (target) => `data-go="${target}"`;
const field = (label, value, opts = {}) => `
  <div class="field"><label>${label}</label>
    <div class="input ${opts.state || ''}">${value ? `<span>${value}</span>` : `<span class="ph">${opts.ph || ''}</span>`}${opts.pw ? '<span class="toggle">Show</span>' : ''}${opts.suffix ? `<span class="muted">${opts.suffix}</span>` : ''}</div>
    ${opts.err ? `<span class="err">${opts.err}</span>` : ''}</div>`;
const seg = (opts, on) => `<div class="seg">${opts.map((o) => `<span class="${o === on ? 'on' : ''}">${o}</span>`).join('')}</div>`;
const fit = (i) => i < GREAT ? `<span class="pill great">${I.check} Great fit</span>` : `<span class="pill ok">${I.dash} OK</span>`;
function macroBar(it) {
  const kp = it.p * 4, kc = it.c * 4, kf = it.f * 9, t = kp + kc + kf;
  return `<div class="bar"><i style="width:${kp / t * 100}%;background:var(--macro-protein)"></i><i style="width:${kc / t * 100}%;background:var(--macro-carbs)"></i><i style="width:${kf / t * 100}%;background:var(--macro-fat)"></i></div>
  <div class="legend"><span><i class="dot" style="background:var(--macro-protein)"></i>P ${it.p}g</span><span><i class="dot" style="background:var(--macro-carbs)"></i>C ${it.c}g</span><span><i class="dot" style="background:var(--macro-fat)"></i>F ${it.f}g</span></div>`;
}
const itemCard = (it, i) => `
  <div class="card">
    <div class="between"><div class="stack"><span class="h2">${it.name}</span><span class="small muted">${it.chain}</span></div>
      <span class="body num" style="font-weight:600;white-space:nowrap">${it.cal} cal</span></div>
    ${macroBar(it)}
    <div class="between" style="align-items:center"><span class="small muted num">${it.score.toFixed(1)} g protein per 100 cal</span>${fit(i)}</div>
    ${M6 ? `<div style="display:flex;justify-content:flex-end;margin-top:-4px"><a class="link" ${go('suggest')}>Suggest a correction</a></div>` : ''}
  </div>`;
const restaurantCard = (r) => `
  <div class="card ${r.fits != null ? 'tap' : ''}" ${r.fits != null ? go('picks') : ''}>
    <div class="between"><span class="h2">${r.name}</span><span class="small muted num" style="white-space:nowrap">${r.dist}</span></div>
    ${r.addr ? `<span class="small muted" style="display:flex;gap:6px;align-items:center">${I.pin}${r.addr}</span>` : ''}
    <div>${r.fits != null ? `<span class="pill great">${I.check} ${r.fits} option${r.fits === 1 ? '' : 's'} fit your goal</span>` : '<span class="pill none">No nutrition data</span>'}</div>
    ${M6 && r.fits != null ? `<div style="display:flex;justify-content:flex-end;margin-top:-4px"><a class="link" ${go('addItem')}>Add an item</a></div>` : ''}

// Frames 01-08 keep the four sections they were drawn with; the M6 frames get the app's current ones
// (web/src/components/AppShell.tsx, mobile/lib/screens/app_shell.dart). Admin shows only for admins.
function webShell(active, content, admin) {

    : [['nearby', 'Nearby'], ['picks', 'Best picks'], ['search', 'Search'], ['targets', 'Profile']];

}
function mobileShell(title, active, content, back) {
  const tabs = M6
    ? [['nearby', 'Nearby'], ['picks', 'Picks'], ['search', 'Search'], ['saved', 'Saved'], ['tracker', 'Tracker'], ['targets', 'Profile']]
    : [['nearby', 'Nearby'], ['picks', 'Picks'], ['search', 'Search'], ['targets', 'Profile']];
  return `<div class="mtop">${back ? `<span ${go(back)} style="cursor:pointer;display:flex">${I.back}</span>` : '<span style="width:24px"></span>'}<span class="brand">${title}</span><span style="width:24px"></span></div>

// ---------- M6 building blocks (#114) ----------
const n0 = (n) => n.toLocaleString('en-US');
const unit = (k) => (k === 'cal' ? ' cal' : ' g');
const servingsText = (s) => `${s} ${s === 1 ? 'serving' : 'servings'}`;
// Segmented control whose segments open other frames.
const segGo = (opts) => `<div class="seg">${opts.map(([l, on, target]) => `<span class="${on ? 'on' : ''}" ${target ? go(target) : ''} style="cursor:pointer">${l}</span>`).join('')}</div>`;
// Tracker goal bar (TrackerPage ProgressBar): eaten fills primary, planned is hatched after it.
function goalBar(k, label, t, goal) {
  const es = Math.min(t.eaten / goal, 1), ps = Math.min(t.planned / goal, 1 - es), over = t.eaten > goal, u = unit(k);
  return `<div class="stack" style="gap:8px">
    <div class="between" style="align-items:baseline"><span class="body" style="font-weight:600">${label}</span>
      <span class="small muted num"><b style="font-weight:600;color:${over ? 'var(--fit-ok-text)' : 'var(--text)'}">${n0(t.eaten)}${u}</b> of ${n0(goal)}${u}</span></div>
    <div class="progress"><i class="${over ? 'overgoal' : 'eaten'}" style="width:${es * 100}%"></i>${ps > 0 ? `<i class="planned" style="width:${ps * 100}%"></i>` : ''}</div>
    <span class="small muted num">${over ? `<b style="color:var(--fit-ok-text);font-weight:600">${n0(t.eaten - goal)}${u} over</b>` : `${n0(goal - t.eaten)}${u} left`}${t.planned ? ` · ${n0(t.planned)}${u} planned` : ''}</span></div>`;
}
const trackChips = () => `<div class="chips" style="flex-wrap:wrap">${NUTRIENTS.map(([k, l]) => `<span class="chip track ${TRACKED.includes(k) ? 'on' : ''}">${TRACKED.includes(k) ? I.check : ''}${l}</span>`).join('')}</div>`;
function entryRow(e, p) {
  const dim = e.planned ? 'opacity:.6;' : '';
  const actions = p === 'web'
    ? `<div style="display:flex;gap:8px">${e.planned ? '<button class="btn primary sm">Ate it</button>' : ''}<button class="btn secondary sm">Delete</button></div>`
    : `<div style="display:flex;align-items:center">${e.planned ? '<button class="btn text">Ate it</button>' : ''}<span class="iconbtn bare">${I.close}</span></div>`;
  return `<div class="lrow" style="${p === 'mobile' ? 'gap:8px' : ''}">
    <div class="stack" style="flex:1;min-width:0;${dim}"><span class="body" style="font-weight:600">${e.name}${e.planned ? ' <span class="small muted" style="font-weight:400">(planned)</span>' : ''}</span>
      <span class="small muted">${e.chain} · ${servingsText(e.s)}</span></div>
    <span class="body num" style="font-weight:600;white-space:nowrap;${dim}">${n0(Math.round(e.cal * e.s))} cal</span>${actions}</div>`;
}
const dateNav = (label, p) => p === 'web'
  ? `<div style="display:flex;align-items:center;gap:8px"><span class="iconbtn">${I.left}</span><span class="body center" style="min-width:150px;font-weight:600">${label}</span><span class="iconbtn">${I.right}</span></div>`
  : `<div class="between" style="align-items:center"><span class="iconbtn bare">${I.left}</span><span class="h2">${label}</span><span class="iconbtn bare">${I.right}</span></div>`;
const cardBox = (inner, gap = 20) => `<div class="card" style="padding:20px;gap:${gap}px">${inner}</div>`;
// Web dialogs sit on a dimmed page, like the native <dialog> in web/src/components/Dialog.tsx.
const dialog = (page, title, body) => `${page}<div class="scrim"><div class="dialog">
  <div class="between"><span class="h2">${title}</span><span class="muted" style="display:flex">${I.close}</span></div>${body}</div></div>`;
const select = (label, value) => `<div class="field"><label>${label}</label><div class="input"><span>${value}</span><span class="muted">▾</span></div></div>`;
const pill = (status) => `<span class="pill ${STATUS[status][1]}">${STATUS[status][1] === 'great' ? I.check : STATUS[status][1] === 'ok' ? I.dash : ''} ${STATUS[status][0]}</span>`;
function changeTable(s) {
  return `<table class="change"><thead><tr>${s.head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>
    ${s.rows.map((r) => `<tr><th>${r[0]}</th>${r.length === 3 ? `<td class="before num">${r[1]}</td>` : ''}<td class="prop num">${r[r.length - 1]}</td></tr>`).join('')}</tbody></table>`;
}
// One submission. admin = the review queue's version: who sent it, flags, note and the allowed actions.
function subCard(s, admin, p) {
  const actions = { pending: ['Approve', 'Reject'], auto_applied: ['Revert'], approved: ['Revert'] }[s.status] || [];
  const noteBox = s.note ? `<p class="note"><b style="font-weight:600">${admin ? `Note${s.reviewer ? ` from ${s.reviewer}` : ''}` : 'Reviewer note'}: </b>${s.note}</p>` : '';
  return `<div class="card" style="padding:${p === 'web' ? 20 : 16}px;gap:12px">
    <div class="between"><div class="stack"><span class="small muted">${s.kind}${admin ? ` · ${s.user}` : ''} · ${s.when}</span><span class="h2" style="font-size:18px">${s.title}</span></div>${pill(s.status)}</div>
    ${admin && s.flags ? `<div class="chips">${s.flags.map((f) => `<span class="pill ok">${I.dash} ${f}</span>`).join('')}</div>` : ''}
    ${changeTable(s)}${noteBox}
    ${admin && actions.length ? `<div style="display:flex;gap:12px;align-items:flex-end">
      <div style="flex:1">${field('Note (optional)', '', { ph: 'Shown to the user' })}</div>
      ${actions.map((a) => `<button class="btn ${a === 'Approve' ? 'primary' : 'secondary'}" style="width:120px">${a}</button>`).join('')}</div>` : ''}
  </div>`;
}

}
function itemForm(p, v) {
  const nums = [['Calories', v.cal, 'cal'], ['Protein', v.p, 'g'], ['Carbs', v.c, 'g'], ['Fat', v.f, 'g']];

        <div class="stack" style="gap:8px"><span class="h2">Entries</span><div class="stack">${DAY_LOG.map((e) => entryRow(e, p)).join('')}</div></div>
        ${cardBox(`<div><span class="h2">Add food</span><p class="small muted">Adds to Thu, Nov 5 as eaten.</p></div>

      <div><span class="h2">Add food</span><p class="small muted">To Thu, Nov 5</p></div>

      <div class="between" style="align-items:center"><span class="iconbtn round">${I.minus}</span><span class="body" style="font-weight:600">1.5 servings</span><span class="iconbtn round">${I.plus}</span></div>

  plan: { m6: true, label: '12 Plan: day or week', render: (p) => {
    const dayCard = (d) => {
      const left = d.items.filter((i) => !i.added).length;

    if (p === 'web') return webShell('tracker', `<div class="stack" style="gap:20px">
      <a class="link" ${go('tracker')}>← Tracker</a>
      <div><span class="h1">Meal plan</span><p class="body muted" style="margin-top:8px">Picks that fit what's left of your daily target. Add them to your tracker as planned, then mark them eaten.</p></div>

  photo: { m6: true, label: '13 Photo: pick or take a photo', render: (p) => {
    if (p === 'web') {

      return dialog(trackerPage(p, false), 'Log from photo', `<div class="stack center" style="gap:12px;padding:32px 0;align-items:center">${I.spinner}<p class="body muted">Looking at your meal…</p></div>`);

    return mobileShell('Log from a photo', null, `<div class="stack center" style="gap:16px;padding-top:120px">
      <span class="empty-icon">${I.camera.replace(/20/g, '32')}</span>
      <span class="h2">Log a meal from a photo</span>
      <p class="body muted">We list the food we can see, and you check it before anything is logged. The photo is only used for this and is not saved.</p>
      <button class="btn primary" style="gap:8px" ${go('photoConfirm')}>${I.camera} Take a photo</button>
      <button class="btn secondary" style="gap:8px" ${go('photoConfirm')}>${I.gallery} Choose a photo</button></div>`, 'tracker');
  } },

  photoConfirm: { m6: true, label: '14 Photo: confirm and log', render: (p) => {
    const g = (l, v) => `${l} ${v} g`;
    if (p === 'web') {
      const conf = { high: 'great', medium: 'ok', low: 'none' };
      const rows = PHOTO.map((r) => `<div class="stack" style="gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
        <div class="between"><div class="stack"><span class="body" style="font-weight:600">${r.name}</span><span class="small muted">${r.chain || 'Not on our menus'}</span></div>
          <span class="pill ${conf[r.conf]}">${r.conf} confidence</span></div>
        <div style="display:flex;align-items:flex-end;gap:12px"><div style="width:120px">${field('Servings', String(r.s))}</div>
          <span class="small muted num" style="padding-bottom:14px">${r.cal} cal</span>
          <div style="margin-left:auto;display:flex;gap:8px;padding-bottom:4px"><button class="btn text">${r.editing ? 'Done editing' : 'Edit'}</button><button class="btn secondary sm">Remove</button></div></div>
        ${r.editing ? `<div class="subcard" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="grid-column:span 4">${field('Name', r.name)}</div>
          ${field('Calories', String(r.cal), { suffix: 'cal' })}${field('Protein', String(r.p), { suffix: 'g' })}${field('Carbs', String(r.c), { suffix: 'g' })}${field('Fat', String(r.f), { suffix: 'g', state: 'focus' })}</div>` : ''}
      </div>`).join('');
      return dialog(trackerPage(p, false), 'Log from photo', `<p class="small muted" style="flex-shrink:0">Check what we found before it goes in your log for Thu, Nov 5. Fix servings, remove anything wrong, or edit the numbers.</p>
        <div class="stack" style="flex:1;min-height:0;overflow:hidden">${rows}</div>
        <div style="display:flex;gap:12px;flex-shrink:0"><button class="btn secondary">Cancel</button><button class="btn primary" ${go('tracker')}>Log 3 items</button></div>`);
    }
    const sure = { medium: 'Fairly sure', low: 'Not sure: check this one' };
    const cards = PHOTO.map((r) => `<div class="card" style="gap:8px">
      <div class="between"><div class="stack"><span class="body" style="font-weight:600">${r.name}</span><span class="small muted">${r.matched ? r.chain : 'Not on our menus'}</span></div><span class="iconbtn bare" style="margin:-8px -8px 0 0">${I.close}</span></div>
      ${sure[r.conf] ? `<div><span class="pill ok">${I.help} ${sure[r.conf]}</span></div>` : ''}
      <span class="small muted num">${r.cal} cal a serving · ${g('P', r.p)} · ${g('C', r.c)} · ${g('F', r.f)}</span>
      <div style="display:flex;align-items:center;gap:8px"><span class="iconbtn round">${I.minus}</span><span class="body center" style="width:110px;font-weight:600">${servingsText(r.s)}</span><span class="iconbtn round">${I.plus}</span>
        ${r.matched ? '' : '<button class="btn text" style="margin-left:auto">Edit</button>'}</div></div>`).join('');
    return mobileShell('Log from a photo', null, `<div><span class="h2">Check what we found</span><p class="small muted">Logging to Thu, Nov 5. Fix the servings and remove anything that's wrong.</p></div>
      ${cards}<button class="btn primary" ${go('tracker')}>Log 3 items</button><button class="btn secondary" ${go('photo')}>Use another photo</button>`, 'photo');

  suggest: { m6: true, label: '15 Suggest a correction', render: (p) => {

    return p === 'web'
      ? dialog(SCREENS.picks.render(p), 'Suggest a correction', `${intro}${itemForm(p, v)}${send}`)

  } },

  addItem: { m6: true, label: '16 Add an item', render: (p) => {
    const v = { name: 'Grilled Nuggets (5 ct)', category: 'Entree', cal: '80', p: '16', c: '1', f: '', focus: 'Fat' };

      : mobileShell('Add an item', null, `<span class="h2">Chick-fil-A</span>${intro}${itemForm(p, v)}${send}`, 'picks');

  addChain: { m6: true, label: '17 Add a restaurant', render: (p) => {

  submissions: { m6: true, label: '18 My submissions', render: (p) => {
    const list = [SUBS.correction, SUBS.chain, SUBS.rename, SUBS.item].map((s) => subCard(s, false, p)).join('');
    const intro = "Corrections, new items and restaurants you've sent. Suggest a correction from any menu item card.";
    if (p === 'web') return webShell('submissions', `<div class="stack" style="gap:24px">
      <div class="between" style="align-items:flex-end"><div><span class="h1">My submissions</span><p class="body muted" style="margin-top:8px">${intro}</p></div>

      <div class="stack" style="gap:12px">${list}</div></div>`);
    return mobileShell('My submissions', null, `<p class="body muted">${intro}</p><button class="btn secondary" ${go('addChain')}>Add a restaurant</button>${list}`, 'targets');

  admin: { m6: true, web: true, label: '19 Admin: review queue', render: (p) => adminPage('Pending review', '2 submissions', [SUBS.item, SUBS.chain]) },

};

// The tracker (web/src/pages/TrackerPage.tsx, mobile/lib/screens/tracker_screen.dart). Also the page behind
// the photo dialogs and the Add food sheet.
function trackerPage(p, week) {
  const t = week ? WEEK_TOTALS : DAY_TOTALS, days = week ? 7 : 1;
  const bars = NUTRIENTS.filter(([k]) => TRACKED.includes(k)).map(([k, l]) => goalBar(k, l, t[k], GOAL[k] * days)).join('');
  const viewSeg = segGo([['Day', !week, 'tracker'], ['Week', week, 'trackerWeek']]);
  const label = week ? 'Nov 2 – Nov 8' : 'Today, Nov 5';
  const entries = week
    ? WEEK_DAYS.map((d) => `<div class="stack"><div class="between small muted" style="font-weight:600;margin-top:8px"><span>${d.day}</span>${p === 'web' ? `<span class="num">${n0(d.eaten)} cal eaten</span>` : ''}</div>
        ${d.log.map((e) => entryRow(e, p)).join('')}</div>`).join('')
    : DAY_LOG.map((e) => entryRow(e, p)).join('');
  if (p === 'web') return webShell('tracker', `<div class="stack" style="gap:24px">
    <div class="between" style="align-items:flex-end"><div><span class="h1">Tracker</span><p class="body muted" style="margin-top:8px">What you've eaten against your daily targets.</p></div>
      <div style="display:flex;gap:12px"><button class="btn secondary auto" ${go('photo')}>${I.camera} Log from photo</button><button class="btn primary auto" ${go('plan')}>Plan meals</button></div></div>
    <div class="between" style="align-items:center"><div style="width:240px">${viewSeg}</div>${dateNav(label, p)}</div>
    <div class="stack" style="gap:8px"><span class="small" style="font-weight:600">Track</span>${trackChips()}</div>
    ${cardBox(`<span class="h2">${week ? 'Weekly goal' : 'Today’s goal'}</span>${bars}`)}
    <div class="stack" style="gap:8px"><span class="h2">Entries</span><div class="stack">${entries}</div></div></div>`);
  return mobileShell('Tracker', 'tracker', `${viewSeg}${dateNav(label, p)}
    <div class="card" style="gap:16px">${bars}</div>${trackChips()}
    <div class="grid2"><button class="btn secondary" style="gap:8px" ${go('plan')}>${I.menu} Plan meals</button><button class="btn secondary" style="gap:8px" ${go('photo')}>${I.camera} Log a photo</button></div>
    <div class="stack">${entries}</div>`) + `<span class="fab" ${go('addFood')}>${I.plus} Add food</span>`;
}

// Review queue (web/src/pages/AdminPage.tsx). Pending edits come without "before" (contract), so before vs
// proposed shows on applied changes, which is where Revert is.
function adminPage(show, count, subs) {
  return webShell('admin', `<div class="stack" style="gap:24px">
    <div><span class="h1">Review submissions</span><p class="body muted" style="margin-top:8px">Approve or reject what auto-moderation flagged, or revert a change that went live.</p></div>
    <div class="between" style="align-items:flex-end"><div style="width:280px">${select('Show', show)}</div>
      <span class="small muted">${count}</span></div>
    <div class="stack" style="gap:12px">${subs.map((s) => subCard(s, true, 'web')).join('')}</div></div>`, true);
}

// ---------- render ----------
const ORDER = ['login', 'loginError', 'signup', 'checkEmail', 'profile', 'targets', 'nearby', 'picks',
  'tracker', 'trackerWeek', 'addFood', 'plan', 'photo', 'photoConfirm', 'suggest', 'addItem', 'addChain', 'submissions', 'admin', 'adminApplied'];
const frameHTML = (p, key) => {
  M6 = !!SCREENS[key].m6;
  return `<div class="frame ${p}" id="${p}-${key}">${SCREENS[key].render(p)}</div>`;
};
const root = document.getElementById('root');
const single = new URLSearchParams(location.search).get('frame');

if (single) {
  const [p, key] = single.split('-');
  document.body.classList.add('single');
  root.innerHTML = frameHTML(p, key);
  document.title = `${p === 'web' ? 'Web' : 'Mobile'}: ${SCREENS[key].label}`;
} else {
  root.innerHTML = `<div class="canvas">${['web', 'mobile'].map((p) => `
    <h2 class="group">${p === 'web' ? 'Web (1280 x 832)' : 'Mobile, Android (412 x 917)'}</h2>
    <div class="row">${ORDER.filter((k) => p === 'web' || !SCREENS[k].web).map((k) => `<div class="slot"><span class="label">${SCREENS[k].label}</span>${frameHTML(p, k)}</div>`).join('')}</div>`).join('')}</div>`;
}

// Click-through: buttons and links with data-go open the next screen on the same platform.
root.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go]');
  if (!el) return;
  const frame = el.closest('.frame');
  const p = frame.classList.contains('web') ? 'web' : 'mobile';
  const target = `${p}-${el.dataset.go}`;
  if (single) location.search = `?frame=${target}`;
  else document.getElementById(target)?.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
});
</script>
</body>
