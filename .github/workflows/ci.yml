name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never kill a main deploy mid-run

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files through the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: [backend/**, .github/workflows/ci.yml]
            web: [web/**, .github/workflows/ci.yml]
            mobile: [mobile/**, .github/workflows/ci.yml]

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-mongodb:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        # shortcut: mongo:8 exits at startup on the runner's Ubuntu 7.0 kernel (SERVER-136848); switch to mongo:8 (prod is 8.0) once that is fixed
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: 5050
      MONGODB_URI: mongodb://localhost:27017
      JWT_SECRET: ci-secret
      CLIENT_URL: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev
      - name: Load schema and seed
        working-directory: backend/db
        run: npx -y mongosh@2 "$MONGODB_URI" schema.js seed.js
        env:
          SEED_ADMIN: "1" # adds siteadmin for the admin tests; never set for production
      - name: API tests against the seeded database
        run: npm run test:db
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017
      - name: Start server
        id: start
        run: nohup node src/server.js > server.log 2>&1 &
      - name: Wait for health
        run: |
          for _ in $(seq 30); do
            body=$(curl -fsS http://localhost:5050/api/health) && break
            sleep 1
          done
          echo "$body"
          grep -q '"db":true' <<< "$body"
      - name: Seed login returns 200
        run: |
          code=$(curl -sS -o /dev/stderr -w '%{http_code}' -X POST http://localhost:5050/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"jane.doe@example.com","password":"Password123!"}')
          echo; echo "HTTP $code"
          test "$code" = 200
      - name: Stop server
        if: always() && steps.start.outcome == 'success'
        run: pkill -f "node src/server.js" || true
      - name: Server log
        if: failure() && steps.start.outcome == 'success'
        run: cat server.log

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x # pubspec.lock needs Dart 3.13 (mobile/README.md)
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The release APK, on PRs too: catches Gradle/manifest breaks that flutter test can't. Not in deploy's needs, so a
  # slow Android build never holds up the web deploy.
  android-apk:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # AGP 9 needs 17+
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      # main only: the team key, so each APK installs over the last (mobile/README.md, "CI builds").
      - name: Release signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK uses a one-off debug key and won't install over an earlier one"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # The run number as versionCode, so every build is newer than the last. Release builds call productionApiUrl.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: menu-macro-fitter-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # Replaces the android-latest pre-release with main's APK: one download link that always matches the deployed site.
  android-release:
    needs: [mobile, android-apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.mobile.result == 'success' && needs.android-apk.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: menu-macro-fitter-apk
      - name: Publish android-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk menu-macro-fitter.apk
          gh release delete android-latest --cleanup-tag --yes || true # not there on the first run
          gh release create android-latest menu-macro-fitter.apk --target "$GITHUB_SHA" --prerelease \
            --title "Android app (latest main)" \
            --notes "Built by CI run $GITHUB_RUN_NUMBER from $GITHUB_SHA. Uses the live API (https://cop4331ruth.lol/api). On the phone: download menu-macro-fitter.apk and allow installs from the browser."

  deploy:
    needs: [changes, backend, backend-mongodb, web, mobile]
    # skipped jobs (paths filter) are fine; failed or cancelled ones block the deploy
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      # the key's forced command in authorized_keys runs deploy/deploy.sh; the `true` is ignored
      - run: ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 deploy@cop4331ruth.lol true
