# Site for the droplet. Replace DOMAIN_PLACEHOLDER with the real domain:
#   sed 's/DOMAIN_PLACEHOLDER/example.com/g' deploy/nginx.conf | sudo tee /etc/nginx/sites-available/app
server {
    # Port 80 only: the Cloudflare proxy (orange cloud) terminates HTTPS in front of us.
    listen 80;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    root /var/www/POOSD_large_proj/web/dist;
    index index.html;

    # No URI after the port, so /api/... reaches Express unchanged (routes are mounted under /api).
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: unknown paths get index.html so React Router handles them.
    location / {
        try_files $uri /index.html;
    }
}
